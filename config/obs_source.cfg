# rev-c4a91e-20260825
# Bongo Cat - OBS wiring
# add the cat to a scene via the bongo cat obs source or window capture

[source]
type=bongo_cat_source
window_class=BongoCatKeyboardWnd
fallback=window_capture

[chroma]
key_color=#FF00FF
similarity=8
smoothness=4

[hotkeys]
skin_menu=F9
layout_cycle=F10
toggle_visible=F11

[streamlabs]
source_type=game_capture
allow_transparency=1
